name: tests

on:
  push:
    branches: [main, master, 'fix/**']
  pull_request:

jobs:
  tools-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: synthetic test dependencies
        run: python3 -m pip install cryptography ruff pyright
      - name: container, CLI, privacy and lifecycle regressions
        run: python3 -m unittest discover -s dm/tests -t . -p 't_*.py' -v
      - name: ruff (check only)
        run: ruff check dm scripts
      - name: Python types
        run: pyright dm scripts
      - name: bounded synthetic mutation corpus
        run: python3 -m dm.tests.fuzz_containers --iterations 300

  pack-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: real signing and publication, synthetic host and assets
        run: python3 -m unittest dm.tests.t_pack_native -v

  native-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: reconstruct exact native fork trees
        run: python3 scripts/bootstrap_vendors.py
      - name: install pinned compiler
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: native runtime tests
        working-directory: vendors/zakuro
        run: cargo +1.99.1 test --locked --workspace
