#!/usr/bin/env bash
# ctr-native's default Azahar configuration (overlaid by each game profile).
# Missing keys take Azahar's own defaults; this template pins what a good
# Mac experience needs so every generated app behaves the same.

[Core]
use_cpu_jit=true
use_cpu_jit\default=false
cpu_clock_percentage=100

[Renderer]
graphics_api=2
graphics_api\default=false
resolution_factor=4
resolution_factor\default=false
async_shader_compilation=true
async_shader_compilation\default=false
async_presentation=true
use_vsync=true
use_hw_shader=true
use_shader_jit=true
use_disk_shader_cache=true
shaders_accurate_mul=true
spirv_shader_gen=true

[Layout]
layout_option=0

[System]
region_value=-1
is_new_3ds=true

[UI]
fullscreen=true
fullscreen\default=false
firstStart=false
firstStart\default=false
confirmClose=false
confirmClose\default=false
singleWindowMode=true
hideInactiveMouse=true
hideInactiveMouse\default=false
enable_discord_presence=false
enable_discord_presence\default=false
showStatusBar=true

[Utility]
custom_textures=false
